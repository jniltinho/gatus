# Default configuration of the jniltinho/gatus fork: example groups and public status pages.
# In the Docker image it is at /config/config.yaml; mount your own file at that path to replace it.
# Documentation of the status-pages section: docs/status-pages.md

endpoints:
  # Group "sites"
  - name: google
    group: sites
    url: "https://www.google.com"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 3000"

  - name: github
    group: sites
    url: "https://github.com"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 72h"

  - name: wikipedia
    group: sites
    url: "https://www.wikipedia.org"
    interval: 2m
    conditions:
      - "[STATUS] == 200"

  # Group "apis"
  - name: github-api
    group: apis
    url: "https://api.github.com"
    interval: 2m
    conditions:
      - "[STATUS] == 200"

  - name: npm-registry
    group: apis
    url: "https://registry.npmjs.org"
    interval: 5m
    conditions:
      - "[STATUS] == 200"

  - name: go-proxy
    group: apis
    url: "https://proxy.golang.org"
    interval: 5m
    conditions:
      - "[STATUS] == 200"

  # Group "dns"
  - name: cloudflare
    group: dns
    url: "1.1.1.1"
    interval: 2m
    dns:
      query-name: "example.com"
      query-type: "A"
    conditions:
      - "[BODY] == pat(*.*.*.*)"
      - "[DNS_RCODE] == NOERROR"

  - name: google-dns
    group: dns
    url: "8.8.8.8"
    interval: 2m
    dns:
      query-name: "example.com"
      query-type: "A"
    conditions:
      - "[BODY] == pat(*.*.*.*)"
      - "[DNS_RCODE] == NOERROR"

  # Group "gatus"
  - name: health
    group: gatus
    url: "http://127.0.0.1:8080/health"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == UP"

# Public status pages, open without login at /status/<slug>
status-pages:
  # Behind a reverse proxy (nginx), set the IP address from which it connects to Gatus, for example the gateway of the
  # Docker network, so that the rate limit is counted per visitor:
  # trusted-proxies: ["172.30.0.1/32"]
  pages:
    - slug: services
      title: "Services"
      description: "External websites and APIs monitored by this Gatus"
      groups: [sites, apis]
      # Shown at the top of the page, with more details
      featured: [sites_github]
      # Response time charts, like the endpoint details page of the dashboard
      charts: [sites_github, apis_github-api]

    - slug: infrastructure
      title: "Infrastructure"
      description: "DNS resolution and the health of Gatus itself"
      groups: [dns, gatus]
