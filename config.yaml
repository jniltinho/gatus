# Configuração padrão do fork jniltinho/gatus: grupos de exemplo e páginas de status públicas.
# Na imagem Docker ela fica em /config/config.yaml; monte o seu arquivo nesse caminho para substituí-la.
# Documentação da seção status-pages: docs/status-pages.md

endpoints:
  # Grupo "sites"
  - name: google
    group: sites
    url: "https://www.google.com"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 3000"

  - name: github
    group: sites
    url: "https://github.com"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 72h"

  - name: wikipedia
    group: sites
    url: "https://www.wikipedia.org"
    interval: 2m
    conditions:
      - "[STATUS] == 200"

  # Grupo "apis"
  - name: github-api
    group: apis
    url: "https://api.github.com"
    interval: 2m
    conditions:
      - "[STATUS] == 200"

  - name: npm-registry
    group: apis
    url: "https://registry.npmjs.org"
    interval: 5m
    conditions:
      - "[STATUS] == 200"

  - name: go-proxy
    group: apis
    url: "https://proxy.golang.org"
    interval: 5m
    conditions:
      - "[STATUS] == 200"

  # Grupo "dns"
  - name: cloudflare
    group: dns
    url: "1.1.1.1"
    interval: 2m
    dns:
      query-name: "example.com"
      query-type: "A"
    conditions:
      - "[BODY] == pat(*.*.*.*)"
      - "[DNS_RCODE] == NOERROR"

  - name: google-dns
    group: dns
    url: "8.8.8.8"
    interval: 2m
    dns:
      query-name: "example.com"
      query-type: "A"
    conditions:
      - "[BODY] == pat(*.*.*.*)"
      - "[DNS_RCODE] == NOERROR"

  # Grupo "gatus"
  - name: health
    group: gatus
    url: "http://127.0.0.1:8080/health"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == UP"

# Páginas de status públicas, abertas sem login em /status/<slug>
status-pages:
  # Atrás de um proxy reverso (nginx), informe o IP de onde ele conecta no Gatus, por exemplo o gateway
  # da rede Docker, para o limite de requisições ser contado por visitante:
  # trusted-proxies: ["172.30.0.1/32"]
  pages:
    - slug: servicos
      title: "Serviços"
      description: "Sites e APIs externos acompanhados por este Gatus"
      groups: [sites, apis]

    - slug: infraestrutura
      title: "Infraestrutura"
      description: "Resolução de DNS e saúde do próprio Gatus"
      groups: [dns, gatus]
