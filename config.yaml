# Default configuration of jniltinho/gatus: example endpoints and two public status pages.
# In the Docker image it is at /config/config.yaml; mount your own file at that path to replace it.
# Check a change before applying it:   gatus config validate --config config.yaml
#
# Documentation: docs/README.md (every option), docs/status-pages.md, docs/admin-endpoints.md, docs/push-monitoring.md

# ---------------------------------------------------------------------------------------------------------------------
# Administration through the web (/admin): create, edit and remove endpoints, status pages and push keys without
# touching this file. It is off by default, because it needs a password of yours. The MINIMUM to turn it on is the
# three blocks below: a SQL storage, a login and admin.enabled. With them, this file does not even need "endpoints".
#
#   1. gatus password hash            (or: docker run --rm -it jniltinho/gatus:<version> password hash)
#   2. paste the hash below, uncomment the three blocks and restart
#
# storage:
#   type: sqlite                      # or postgres, or mysql (MySQL 8.4+ / MariaDB 10.11+, see docs/storage-mysql.md)
#   path: /data/data.db               # in Docker, mount a volume at /data
#
# security:
#   basic:
#     username: admin
#     password-bcrypt-base64: "PASTE-THE-HASH-HERE"
#
# admin:
#   enabled: true
#
# A ready-to-run example with Docker Compose is in .examples/docker-compose-admin.
# ---------------------------------------------------------------------------------------------------------------------

# Without "storage", the history lives in memory and is lost on restart. To keep it without the administration:
# storage:
#   type: sqlite
#   path: /data/data.db

# ui:
#   logo: /logo-192x192.png           # the logo served by Gatus itself, in the header and on the login screen

endpoints:
  # Group "sites"
  - name: google
    group: sites
    url: "https://www.google.com"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 3000"

  - name: github
    group: sites
    url: "https://github.com"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 72h"

  - name: wikipedia
    group: sites
    url: "https://www.wikipedia.org"
    interval: 2m
    conditions:
      - "[STATUS] == 200"

  # Group "apis"
  - name: github-api
    group: apis
    url: "https://api.github.com"
    interval: 2m
    conditions:
      - "[STATUS] == 200"

  - name: npm-registry
    group: apis
    url: "https://registry.npmjs.org"
    interval: 5m
    conditions:
      - "[STATUS] == 200"

  - name: go-proxy
    group: apis
    url: "https://proxy.golang.org"
    interval: 5m
    conditions:
      - "[STATUS] == 200"

  # Group "dns"
  - name: cloudflare
    group: dns
    url: "1.1.1.1"
    interval: 2m
    dns:
      query-name: "example.com"
      query-type: "A"
    conditions:
      - "[BODY] == pat(*.*.*.*)"
      - "[DNS_RCODE] == NOERROR"

  - name: google-dns
    group: dns
    url: "8.8.8.8"
    interval: 2m
    dns:
      query-name: "example.com"
      query-type: "A"
    conditions:
      - "[BODY] == pat(*.*.*.*)"
      - "[DNS_RCODE] == NOERROR"

  # Group "gatus"
  - name: health
    group: gatus
    url: "http://127.0.0.1:8080/health"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == UP"

# A Push endpoint is passive: a script reports at /api/push/<token>?status=up&msg=OK&ping=<ms>, like on the Uptime Kuma,
# and Gatus records a failure when no push arrives within the heartbeat interval (docs/push-monitoring.md).
# external-endpoints:
#   - name: nightly-backup
#     group: jobs
#     token: "a-long-random-secret-with-at-least-16-characters"
#     heartbeat:
#       interval: 25h

# Public status pages, open without login at /status/<slug>
status-pages:
  # Behind a reverse proxy (nginx), set the IP address from which it connects to Gatus, for example the gateway of the
  # Docker network, so that the rate limit is counted per visitor:
  # trusted-proxies: ["172.30.0.1/32"]
  pages:
    - slug: services
      title: "Services"
      description: "External websites and APIs monitored by this Gatus"
      groups: [sites, apis]
      # Shown at the top of the page, with more details. Every endpoint of a page also opens a public details page
      # (/status/<slug>/endpoints/<key>) with its response time chart.
      featured: [sites_github]
      # Days until the TLS certificate expires, below the name of each endpoint
      show-certificate-expiration: true
      # Other options of a page, all off by default:
      # show-messages: true             # publishes the message of pushes and the HTTP status on the details page
      # auth:                           # asks for a username and a password of its own to open the page
      #   username: customer
      #   password-bcrypt-base64: "PASTE-ANOTHER-HASH-HERE"

    - slug: infrastructure
      title: "Infrastructure"
      description: "DNS resolution and the health of Gatus itself"
      groups: [dns, gatus]
      # The groups start collapsed, showing their status and counts; a visitor expands the ones they want, and a group
      # with a problem always appears expanded
      groups-collapsed: true
