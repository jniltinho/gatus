# Gatus with the administration through the web (/admin): endpoints, status pages and push keys are created in the
# browser and kept in SQLite. See config/config.yaml for the two steps before the first start.
services:
  gatus:
    image: jniltinho/gatus:v6.1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # publish it through a reverse proxy, not directly (docs/install-linux.md has an nginx example)
    volumes:
      - ./config:/config:ro
      - gatus-data:/data

volumes:
  gatus-data:
