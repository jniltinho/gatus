name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  go:
    name: Go (lint, build e testes)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: gatus
          POSTGRES_PASSWORD: gatus
          POSTGRES_DB: gatus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gatus -d gatus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Testes do store em PostgreSQL (sem a variável, esses testes rodam só em SQLite)
      GATUS_TEST_POSTGRES_URL: postgres://gatus:gatus@127.0.0.1:5432/gatus?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Histórico completo: o lint compara os arquivos com o commit UPSTREAM_BASE
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      - name: Test
        # sudo: um dos testes usa ping (ICMP), que exige privilégios de superusuário.
        # As variáveis mantêm o Go e os caches configurados pelo setup-go.
        run: sudo env "PATH=$PATH" "GOROOT=$(go env GOROOT)" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" "GATUS_TEST_POSTGRES_URL=$GATUS_TEST_POSTGRES_URL" go test ./... -race
