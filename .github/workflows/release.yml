name: Release

on:
  push:
    tags:
      - 'v*-fork.*'

permissions:
  contents: write

jobs:
  release:
    name: Pacotes e GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        # sudo: um dos testes usa ping (ICMP), que exige privilégios de superusuário
        run: sudo env "PATH=$PATH" "GOROOT=$(go env GOROOT)" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" go test ./... -race

      - name: Build release packages
        run: make release-cross VERSION="${GITHUB_REF_NAME#v}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Notas a partir da release anterior do fork; na primeira release de uma base,
          # a partir da tag do upstream (ex.: v5.36.0), para não listar todo o histórico.
          previous=$(git tag --list 'v*-fork.*' --sort=-v:refname | grep -vxF "$GITHUB_REF_NAME" | head -n1 || true)
          if [ -z "$previous" ] && git rev-parse -q --verify "refs/tags/${GITHUB_REF_NAME%-fork.*}" >/dev/null; then
            previous="${GITHUB_REF_NAME%-fork.*}"
          fi
          args=(--title "$GITHUB_REF_NAME" --generate-notes --latest --verify-tag)
          if [ -n "$previous" ]; then
            args+=(--notes-start-tag "$previous")
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}" \
            dist/gatus_*_linux_amd64.tar.gz \
            dist/gatus_*_linux_arm64.tar.gz
